name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  filter:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - '!**.md'

  quality:
    name: Code Quality and Coverage
    needs: filter
    if: needs.filter.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting check (Prettier)
        run: pnpm exec prettier --check .

      - name: Linter (ESLint)
        run: pnpm run lint

      - name: Type check (TSC)
        run: pnpm exec tsc -b

      - name: Unit and Component Tests with Coverage
        run: pnpm run test:coverage

  e2e-mock:
    name: E2E Tests (Mocked Browser)
    needs: filter
    if: needs.filter.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Mock Suite
        run: pnpm run test:e2e

  e2e-integration:
    name: E2E Integration (Real Backend)
    needs: filter
    if: needs.filter.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Real Backend Services
        run: |
          docker compose -f e2e/backend/compose.yaml pull
          docker compose -f e2e/backend/compose.yaml up -d --wait --wait-timeout 180

      - name: Run Real Integration Suite
        run: pnpm run test:e2e:integration

      - name: Stop Backend Services
        if: always()
        run: docker compose -f e2e/backend/compose.yaml down -v

  build:
    name: Build Frontend Bundle
    needs: filter
    if: needs.filter.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
